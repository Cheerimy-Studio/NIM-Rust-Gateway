name: Test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test locked dependencies
        run: cargo test --locked --all-targets
      - name: Check frontend syntax and reward interactions
        run: |
          node --check web/admin.js
          node --check web/user.js
          node tests/frontend-rewards.cjs
