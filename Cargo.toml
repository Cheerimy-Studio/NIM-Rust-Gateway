[package]
name = "nim-gateway"
version = "1.7.15"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "deflate", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
rand = "0.8"
md-5 = "0.10"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
subtle = "2"
base64 = "0.22"
chrono = "0.4"
futures = "0.3"
percent-encoding = "2"
tar = "0.4"
socket2 = "0.5"
flate2 = "1"

[profile.release]
opt-level = 2
debug = false
