<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 01Code</title><style>body{font:16px system-ui;background:#f5f5f3;color:#232321;display:grid;place-items:center;min-height:95vh}main{background:white;border:1px solid #ddd;border-radius:16px;padding:32px;max-width:420px}h1{font-size:24px}dt{color:#666;margin-top:16px}dd{margin:4px 0}button,a{padding:12px 20px;border-radius:8px;border:1px solid #ccc;cursor:pointer}button:first-of-type{background:#232321;color:white}#status{color:#a33}</style><main><h1>登录 01Code</h1><p>仅允许你刚刚在桌面客户端发起的请求。</p><dl><dt>设备</dt><dd id="client"></dd><dt>发起 IP</dt><dd id="ip"></dd><dt>请求时间</dt><dd id="time"></dd><dt>验证码</dt><dd id="code"></dd></dl><button id="allow">允许登录</button> <button id="deny">拒绝</button><p id="status" role="status"></p></main><script>const d=DEVICE_DATA;for(const k of ['client','ip','code'])document.getElementById(k).textContent=d[k];document.getElementById('time').textContent=new Date(d.created*1000).toLocaleString();async function decide(decision){const buttons=[...document.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);try{const session=await fetch('/api/user/session',{cache:'no-store'});if(!session.ok)throw Error('请重新登录');const {csrf}=await session.json();const r=await fetch('/api/device/authorize',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF':csrf},body:JSON.stringify({code:d.code,decision})});if(!r.ok)throw Error('授权未完成，请重新发起登录');location.replace('/user');}catch(e){document.getElementById('status').textContent=e.message;buttons.forEach(b=>b.disabled=false);}}document.getElementById('allow').onclick=()=>decide('allow');document.getElementById('deny').onclick=()=>decide('deny');</script></html>
