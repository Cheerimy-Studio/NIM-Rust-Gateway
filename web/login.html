<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>言灵中转 · 登录</title>
<link href="/assets/vendor/bootstrap.min.css" rel="stylesheet">
<link href="/assets/vendor/bootstrap-icons.min.css" rel="stylesheet">
<style>
:root{--acc:#2f6fed;--txt:#1c2536;--mut:#68758a;--line:#e7ecf3}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;
  color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 520px at 8% -10%,#e8f0ff 0%,transparent 62%),
             radial-gradient(760px 460px at 105% 110%,#e9fbf4 0%,transparent 58%),
             linear-gradient(160deg,#f8fafd 0%,#f3f6fb 100%)}
.login-shell{width:100%;max-width:980px;display:grid;grid-template-columns:minmax(0,1.08fr) 420px;
  gap:56px;align-items:center}
.login-intro{max-width:470px}
.brand-row{display:flex;align-items:center;gap:12px}
.brand-row .mark{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;font-weight:800;font-size:20px;
  box-shadow:0 8px 22px rgba(37,99,235,.28),inset 0 1px 0 rgba(255,255,255,.3)}
.brand-row b{display:block;font-size:16px;letter-spacing:.2px}
.brand-row small{display:block;font-size:10px;letter-spacing:1.6px;color:#98a3b8;text-transform:uppercase;margin-top:2px}
.login-intro h1{font-size:38px;line-height:1.18;letter-spacing:-1.2px;margin:28px 0 14px;font-weight:750}
.login-intro p{font-size:15px;line-height:1.85;color:var(--mut);margin:0;max-width:430px}
.feature-list{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:11px;font-size:13px;color:#5b6b84}
.feature-list i{color:var(--acc);margin-right:9px;font-size:13px}
.card-login{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px;
  padding:34px 32px 30px;box-shadow:0 26px 70px rgba(16,24,40,.09)}
.form-head{margin-bottom:22px}
.form-head h2{font-size:21px;font-weight:750;margin:0 0 5px;letter-spacing:-.2px}
.form-head p{font-size:12.5px;color:var(--mut);margin:0}
.form-label{font-size:12px;color:#5b6b84;margin-bottom:5px}
.form-control{border-radius:10px;border-color:#dde4ee;padding:.65rem .85rem;font-size:14px;background:#fbfcfe}
.form-control:hover{border-color:#c9d4e4}
.form-control:focus{border-color:var(--acc);background:#fff;box-shadow:0 0 0 .2rem rgba(47,111,237,.12)}
.btn-primary{width:100%;border-radius:10px;padding:.68rem;font-size:14px;font-weight:600;border:none;
  background:linear-gradient(135deg,#3576f0,#2a5ce0);box-shadow:0 6px 18px rgba(37,99,235,.28);transition:all .15s ease}
.btn-primary:hover{background:linear-gradient(135deg,#2a5ce0,#1f4fd0);box-shadow:0 8px 24px rgba(37,99,235,.35);transform:translateY(-1px)}
.err{display:none;color:#dc2626;font-size:13px;margin-bottom:10px;padding:8px 10px;border-radius:8px;background:#fef2f2}
.login-foot{margin-top:18px;text-align:center;font-size:11.5px;color:#98a3b8}
@media(max-width:880px){
  body{padding:20px}
  .login-shell{grid-template-columns:1fr;max-width:420px;gap:0}
  .login-intro{display:none}
  .card-login{padding:30px 24px 26px}
}
</style>
<link rel="stylesheet" href="/assets/ui.css?v={{VERSION}}">
</head>
<body data-page="login">
  <div class="login-shell">
    <section class="login-intro">
      <div class="brand-row"><span class="mark">言</span><div><b>言灵中转</b><small>NIM Rust Gateway</small></div></div>
      <h1>统一接入<br>稳定转发</h1>
      <p>OpenAI / Anthropic 兼容网关，账号池调度、模型路由、按 token 计费与 WebClaw 浏览器 Agent 集中管理。</p>
      <ul class="feature-list">
        <li><i class="bi bi-check2-circle"></i>多协议转换与流式透传</li>
        <li><i class="bi bi-check2-circle"></i>渠道健康度、重试与模型熔断</li>
        <li><i class="bi bi-check2-circle"></i>用户 Key、用量账本与模型广场</li>
      </ul>
    </section>
    <section class="card-login">
      <div class="form-head">
        <h2>管理后台</h2>
        <p>使用管理员账号登录控制台</p>
      </div>
      <div id="login-err" class="err" role="alert"></div>
      <form id="login-form">
        <div class="mb-3">
          <label class="form-label" for="admin-user">账号</label>
          <input id="admin-user" type="text" class="form-control" name="username" autocomplete="username" autofocus required>
        </div>
        <div class="mb-4">
          <label class="form-label" for="admin-password">密码</label>
          <input id="admin-password" type="password" class="form-control" name="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary">登录</button>
      </form>
    </section>
  </div>
<script>
document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const button = e.target.querySelector('button');
  if (button.disabled) return;
  const error = document.getElementById('login-err');
  const fd = new FormData(e.target);
  error.style.display = 'none'; button.disabled = true; button.textContent = '登录中…';
  try {
    const response = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: fd.get('username'), password: fd.get('password')})});
    if (response.ok) { location.href = '/admin'; return; }
    const data = await response.json().catch(() => ({}));
    throw new Error(data.error?.message || '登录失败，请稍后重试');
  } catch (e) {
    error.textContent = e.message || '无法连接服务，请稍后重试'; error.style.display = 'block';
  } finally { button.disabled = false; button.textContent = '登录'; }
});
</script>
</body>
</html>
