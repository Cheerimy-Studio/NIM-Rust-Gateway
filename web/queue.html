<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>队列状态 · NVIDIA Gateway</title>
<style>
body{margin:0;font-size:14px;color:#1c2536;background:#f3f5f9;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.hdr{background:linear-gradient(160deg,#0e1729,#0b1120);color:#8d9bb2;padding:13px 24px;font-size:13px;
  display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.05)}
.hdr .hl{display:flex;align-items:center;gap:10px}
.hdr .mark{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(135deg,#3b82f6,#1d4ed8);font-weight:800;font-size:12.5px;
  box-shadow:0 3px 10px rgba(37,99,235,.4)}
.hdr b{color:#fff;font-size:14.5px;font-weight:700;letter-spacing:.2px}
.wrap{max-width:720px;margin:26px auto;padding:0 16px}
.stat{display:flex;gap:14px;margin-bottom:22px}
.stat-card{flex:1;background:#fff;border:1px solid #e7ecf3;border-radius:12px;padding:16px 18px;text-align:center;
  box-shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.03);transition:box-shadow .16s ease,transform .16s ease}
.stat-card:hover{box-shadow:0 8px 22px rgba(16,24,40,.09);transform:translateY(-1px)}
.stat-card .num{font-size:1.65rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.stat-card .lbl{font-size:11px;color:#68758a;letter-spacing:.4px;margin-top:3px}
.ok{color:#16a34a}.warn{color:#d97706}.err{color:#dc2626}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:12px;overflow:hidden;
  border:1px solid #e7ecf3;box-shadow:0 1px 2px rgba(16,24,40,.04)}
th{background:#fafbfd;color:#8492a6;font-weight:600;font-size:11.5px;letter-spacing:.5px;text-align:left;
  padding:9px 14px;border-bottom:1px solid #e7ecf3}
td{padding:8px 14px;border-bottom:1px solid #eef2f7}
tr:last-child td{border-bottom:0}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.dot.g{background:#16a34a}.dot.y{background:#d97706}
.muted{color:#98a3b8;font-size:12px}
</style>
</head>
<body>
<div class="hdr"><span class="hl"><span class="mark">N</span><b>NVIDIA Gateway</b></span><span class="muted">队列状态</span></div>
<div class="wrap">
  <div class="stat" id="stats"></div>
  <table>
    <thead><tr><th>#</th><th>等待时间</th><th>模型</th><th>状态</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p class="muted" style="margin-top:12px">当所有账号暂不可用时，请求进入排队等待；队首优先获得下一个可用账号。刷新本页查看排队最新状态。</p>
</div>
<script>
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function refresh(){
  try{
    const r = await fetch('/api/queue/public');
    const d = await r.json();
    const s = document.getElementById('stats');
    const n = d.length || 0;
    const cls = n === 0 ? 'ok' : n < 5 ? 'warn' : 'err';
    s.innerHTML = `
      <div class="stat-card"><div class="num ${cls}">${n}</div><div class="lbl">排队中</div></div>
      <div class="stat-card"><div class="num ${n?'warn':'ok'}">${d.max_wait}s</div><div class="lbl">最长等待</div></div>
      <div class="stat-card"><div class="num ok">✓</div><div class="lbl">服务正常</div></div>`;
    const tb = document.getElementById('rows');
    tb.innerHTML = '';
    if(!n){ tb.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#94a3b8;padding:20px">队列为空</td></tr>'; return; }
    d.rows.forEach((q,i)=>{
      const cls = q.wait > d.max_wait/2 ? 'y' : 'g';
      tb.innerHTML += `<tr><td>${i+1}</td><td><span class="dot ${cls}"></span>${esc(q.wait)}s</td><td>${esc(q.model||'-')}</td><td>${esc(q.hint||'-')}</td></tr>`;
    });
  }catch(e){ console.error(e); }
}
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
