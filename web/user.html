<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用户中心</title>
<link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
body{min-height:100vh;background:linear-gradient(160deg,#0d1526 0%,#0a1120 100%);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  padding:22px 0 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.mark{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-weight:800;font-size:17px;
  box-shadow:0 4px 14px rgba(16,185,129,.4)}
.top-title{color:#fff;font-weight:700;font-size:16px}
.top-sub{color:#8fa0bd;font-size:11px;letter-spacing:1.4px;text-transform:uppercase}
.balance-card{border:0;border-radius:16px;color:#fff;padding:24px 26px;
  background:linear-gradient(135deg,#059669,#0d9488);box-shadow:0 14px 40px rgba(13,148,136,.35)}
.balance-label{font-size:12px;opacity:.85;letter-spacing:1px}
.balance-num{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.balance-unit{font-size:14px;opacity:.85;font-weight:600}
.lim-chip{display:inline-block;background:rgba(255,255,255,.16);border-radius:8px;padding:4px 12px;font-size:12px;margin-right:6px}
.pane{display:none}
.pane.active{display:block}
.cardx{border:0;border-radius:14px;box-shadow:0 10px 30px rgba(2,8,20,.35)}
.nav-pills .nav-link{border-radius:10px;font-size:13.5px;font-weight:600;color:#c6d2e6;padding:.5rem 1rem}
.nav-pills .nav-link.active{background:linear-gradient(135deg,#3576f0,#2a5ce0);color:#fff}
table{font-size:13.5px}
.key-mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.badge-free{background:#d1fae5;color:#047857;font-weight:600}
.badge-paid{background:#fef3c7;color:#92400e;font-weight:600}
.model-card{border:0;border-radius:12px;box-shadow:0 4px 14px rgba(2,8,20,.08)}
.hint{font-size:12px;color:#8fa0bd}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
</style>
</head>
<body>
<div class="container-xl">
  <div class="top">
    <div class="mark">U</div>
    <div><div class="top-title">用户中心</div><div class="top-sub">USER PORTAL</div></div>
    <div class="ms-auto"><button class="btn btn-sm btn-outline-light" id="btn-logout">退出登录</button></div>
  </div>

  <div class="row g-3 mb-3">
    <div class="col-md-5">
      <div class="balance-card">
        <div class="balance-label">账户余额</div>
        <div><span class="balance-num" id="balance">-</span> <span class="balance-unit">元</span></div>
        <div style="margin-top:10px">
          <span class="lim-chip" id="chip-free">免费模型限速 -</span>
          <span class="lim-chip" id="chip-paid">付费模型限速 -</span>
        </div>
      </div>
    </div>
    <div class="col-md-7">
      <ul class="nav nav-pills gap-2">
        <li class="nav-item"><a class="nav-link active" data-p="keys" href="#">API Key</a></li>
        <li class="nav-item"><a class="nav-link" data-p="logs" href="#">调用日志</a></li>
        <li class="nav-item"><a class="nav-link" data-p="models" href="#">模型广场</a></li>
      </ul>
    </div>
  </div>

  <div class="pane active" id="pane-keys">
    <div class="card cardx mb-3"><div class="card-body">
      <div class="d-flex gap-2 align-items-end flex-wrap">
        <div><label class="form-label small fw-semibold mb-1">Key 名称</label>
          <input class="form-control form-control-sm" id="key-name" placeholder="可选，便于识别" style="min-width:220px"></div>
        <button class="btn btn-sm btn-success" id="key-add">生成新 Key</button>
        <span class="hint">调用方式与网关令牌一致：Authorization: Bearer sk-usr-…</span>
      </div>
    </div></div>
    <div class="card cardx"><div class="card-body">
      <table class="table table-hover align-middle mb-0">
        <thead><tr><th>名称</th><th>Key</th><th>状态</th><th>最近调用</th><th></th></tr></thead>
        <tbody id="key-rows"></tbody>
      </table>
    </div></div>
  </div>

  <div class="pane" id="pane-logs">
    <div class="card cardx"><div class="card-body">
      <table class="table table-hover align-middle mb-0">
        <thead><tr><th>时间</th><th>模型</th><th>状态</th><th>耗时</th><th>输入</th><th>输出</th><th>费用</th></tr></thead>
        <tbody id="log-rows"></tbody>
      </table>
    </div></div>
  </div>

  <div class="pane" id="pane-models">
    <div class="hint mb-2">标有「免费」的模型余额为 0 也可调用；标价为该模型单次成功调用的费用。</div>
    <div class="row g-3" id="model-cards"></div>
  </div>
</div>
<script src="/assets/user.js"></script>
</body>
</html>
