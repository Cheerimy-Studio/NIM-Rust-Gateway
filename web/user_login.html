<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用户中心</title>
<link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<style>
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(1200px 600px at 20% -10%,#1d3561 0%,transparent 60%),
             radial-gradient(1000px 500px at 110% 110%,#17306b 0%,transparent 55%),
             linear-gradient(160deg,#0d1526 0%,#0a1120 100%);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.card-login{width:100%;max-width:372px;border:0;border-radius:16px;padding:34px 30px 28px;background:#fff;
  box-shadow:0 28px 80px rgba(2,8,20,.55)}
.mark{width:44px;height:44px;border-radius:12px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-weight:800;font-size:20px;
  box-shadow:0 6px 18px rgba(16,185,129,.4),inset 0 1px 0 rgba(255,255,255,.25)}
.h-title{text-align:center;font-size:17px;font-weight:700;color:#1c2536;letter-spacing:.2px;margin-bottom:4px}
.h-sub{text-align:center;font-size:11px;color:#98a3b8;letter-spacing:1.6px;text-transform:uppercase;margin-bottom:22px}
.form-control{border-radius:10px;border-color:#dde4ee;padding:.62rem .85rem;font-size:14px}
.form-control:focus{border-color:#10b981;box-shadow:0 0 0 .2rem rgba(16,185,129,.13)}
.btn-primary{width:100%;border-radius:10px;padding:.62rem;font-size:14px;font-weight:600;border:none;
  background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 4px 14px rgba(16,185,129,.35);transition:all .15s ease}
.btn-primary:hover{background:linear-gradient(135deg,#059669,#047857);transform:translateY(-1px)}
.err{display:none;color:#dc2626;font-size:13px;margin-bottom:10px}
.hint{text-align:center;font-size:12px;color:#98a3b8;margin-top:16px}
</style>
</head>
<body>
<div class="card-login">
  <div class="mark">U</div>
  <div class="h-title">用户中心</div>
  <div class="h-sub">USER PORTAL</div>
  <div class="err" id="err"></div>
  <div class="mb-3"><label class="form-label small fw-semibold">用户名</label>
    <input class="form-control" id="username" autocomplete="username"></div>
  <div class="mb-3"><label class="form-label small fw-semibold">密码</label>
    <input class="form-control" id="password" type="password" autocomplete="current-password"></div>
  <button class="btn btn-primary" id="go">登录</button>
  <div class="hint">账号由管理员分配 · <a href="/admin">管理入口</a></div>
</div>
<script>
const $ = s => document.querySelector(s);
async function tryLogin() {
  const r = await fetch('/api/user/login', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({username: $('#username').value.trim(), password: $('#password').value})});
  if (r.ok) { location.href = '/user'; return true; }
  return false;
}
(async () => {
  if (await tryLogin()) return;
  $('#go').onclick = async () => {
    $('#err').style.display = 'none';
    if (!await tryLogin()) { $('#err').textContent = '账号或密码错误'; $('#err').style.display = 'block'; }
  };
  $('#password').addEventListener('keydown', e => { if (e.key === 'Enter') $('#go').click(); });
})();
</script>
</body>
</html>
