<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>浏览器 Agent · WebClaw</title>
<link href="/assets/vendor/bootstrap.min.css" rel="stylesheet">
<link href="/assets/vendor/bootstrap-icons.min.css" rel="stylesheet">
<script defer src="/assets/vendor/marked.min.js"></script>
<script defer src="/assets/vendor/purify.min.js"></script>
<style>
:root{--acc:#2f6fed;--bg:#f3f5f9;--line:#e7ecf3;--txt:#1c2536;--mut:#68758a;
  --r-xs:6px;--r-sm:8px;--r-md:10px;--r:12px;--r-lg:14px;--r-pill:999px;--ring:0 0 0 3px rgba(47,111,237,.12)}
*{scrollbar-width:thin}
body{margin:0;background:var(--bg);color:var(--txt);font-size:14px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
a{text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#c6d0de;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#9fadc2}

.layout{display:grid;grid-template-columns:236px minmax(0,1fr) 330px;min-height:100vh}
.sidebar{width:236px;background:linear-gradient(180deg,#0e1729 0%,#0b1120 100%);color:#8d9bb2;flex-shrink:0;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;border-right:1px solid rgba(255,255,255,.045)}
.brand{display:flex;align-items:center;gap:11px;padding:15px 15px;border-bottom:1px solid rgba(255,255,255,.06)}
.brand .mark{width:31px;height:31px;border-radius:var(--r-md);flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;font-weight:800;font-size:15px;
  box-shadow:0 3px 10px rgba(37,99,235,.4),inset 0 1px 0 rgba(255,255,255,.25)}
.brand .bt{color:#fff;font-weight:700;font-size:14px;letter-spacing:.2px;line-height:1.2}
.brand .bt small{display:block;font-weight:500;font-size:10px;color:#5d6b83;letter-spacing:1.2px;text-transform:uppercase;margin-top:2px}

.side-body{flex:1;display:flex;flex-direction:column;min-height:0;padding:10px}
.nav-label{font-size:10px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:#57657d;padding:10px 10px 6px}
.side-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:8px 10px;border:1px solid rgba(255,255,255,.13);
  border-radius:var(--r-sm);background:rgba(255,255,255,.04);color:#cdd8e8;font-size:12.5px;font-weight:600;transition:all .13s ease}
.side-btn:hover{background:rgba(255,255,255,.09);color:#fff;border-color:rgba(255,255,255,.2)}
.side-btn.primary{background:linear-gradient(135deg,#3576f0,#2a5ce0);border-color:transparent;color:#fff;
  box-shadow:0 3px 10px rgba(37,99,235,.35)}
.side-btn.primary:hover{background:linear-gradient(135deg,#2a5ce0,#1f4fd0)}
.side-row{display:flex;gap:6px;margin-top:8px}
.side-row .side-btn{padding:7px 6px;font-size:12px}

.proj-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px;margin:8px -4px 0;padding:0 4px;min-height:60px}
.proj{position:relative;padding:7px 9px;border-radius:var(--r-sm);cursor:pointer;color:#96a4ba;transition:background .13s ease,color .13s ease}
.proj:hover{background:rgba(255,255,255,.05);color:#e3eaf5}
.proj.active{background:linear-gradient(90deg,rgba(47,111,237,.3),rgba(47,111,237,.05));color:#fff}
.proj.active::before{content:"";position:absolute;left:-4px;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--acc)}
.proj .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:52px}
.proj .mt{font-size:11px;color:#5d6b83;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj.active .mt{color:#8ea6cd}
.proj .ops{position:absolute;right:4px;top:5px;display:flex;gap:0;opacity:0;transition:opacity .13s ease}
.proj:hover .ops,.proj.active .ops{opacity:1}
.proj .ops button{border:0;background:transparent;color:#7c8ba4;padding:2px 4px;border-radius:5px;line-height:1;font-size:11.5px}
.proj .ops button:hover{color:#fff;background:rgba(255,255,255,.12)}
.proj .ops button.del:hover{color:#fca5a5;background:rgba(248,113,113,.16)}
.proj-empty{font-size:12px;color:#57657d;text-align:center;padding:16px 0}
.scope-chip{display:inline-flex;align-items:center;margin-left:8px;padding:2px 10px;border-radius:999px;
  background:#e8f0fe;border:1px solid #c7dbff;color:#1a5fd0;font-size:12px;font-weight:600;line-height:18px;vertical-align:middle}

.sidebar .foot{padding:8px 10px;border-top:1px solid rgba(255,255,255,.06)}
.sidebar .foot a{color:#8d9bb2;font-size:13px;border-radius:var(--r-sm);padding:7px 11px;display:inline-flex;align-items:center;gap:6px;transition:all .13s ease}
.sidebar .foot a:hover{color:#e3eaf5;background:rgba(255,255,255,.06)}

.rightbar{background:#fff;border-left:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;height:100vh;overflow:auto}
.right-card{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.right-card-head{display:flex;align-items:center;gap:7px;padding:10px 12px;font-size:12.5px;font-weight:600;border-bottom:1px solid var(--line);color:#2c3a52}
.right-card-head .bi{color:#7c8ba4}
.right-card-body{padding:10px 12px}
.gh-status{margin-left:auto;font-size:10.5px;color:#98a3b8;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.gh-status.ok{color:#15803d}
.gh-field{margin-bottom:7px}
.gh-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.gh-hint{font-size:10.5px;color:#98a3b8;line-height:1.5;margin-top:6px}
.gh-runs{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto}
.gh-run{border:1px solid #edf1f7;border-radius:8px;padding:6px 8px;font-size:11.5px;cursor:pointer}
.gh-run:hover{border-color:#cfdaea;background:#fbfdff}
.gh-run-top{display:flex;gap:6px;align-items:center}
.gh-run-name{font-weight:600;color:#2c3a52;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gh-run-meta{color:#98a3b8;font-size:10.5px;margin-top:2px}
.gh-badge{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:999px;background:#f1f5f9;color:#64748b;white-space:nowrap}
.gh-badge.ok{background:#ecfdf5;color:#047857}.gh-badge.bad{background:#fef2f2;color:#b91c1c}.gh-badge.run{background:#fffbeb;color:#b45309}
.right-card .workspace-files{max-height:180px;overflow:auto}
.content{flex:1;padding:20px 24px;min-width:0;display:flex;flex-direction:column;gap:10px}
.pane-title{font-size:17px;font-weight:700;margin:0 0 4px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.pane-title::before{content:"";width:3px;height:15px;border-radius:2px;background:linear-gradient(180deg,#4d86f2,#2a5ce0);flex-shrink:0}
.pane-title .sub{font-size:11.5px;font-weight:500;color:#98a3b8;letter-spacing:.3px;margin-left:2px}

.card{border:1px solid var(--line);border-radius:var(--r);background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card-header{background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:13px;color:#2c3a52;
  border-radius:var(--r) var(--r) 0 0;padding:.55rem .9rem}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .form-select-sm{min-width:230px;max-width:340px}
.toolbar #wc-system{max-width:200px}
.toolbar .spacer{flex:1}
.btn-sm{font-size:12.5px}
.btn-primary{background:linear-gradient(135deg,#3576f0,#2a5ce0);border:none}
.btn-primary:hover{background:linear-gradient(135deg,#2a5ce0,#1f4fd0)}
.form-control-sm,.form-select-sm{font-size:13px;border-color:#dde4ee}
.form-control-sm:focus,.form-select-sm:focus{border-color:var(--acc);box-shadow:var(--ring)}

.cred{display:flex;gap:6px;align-items:center}
.cred .form-control-sm{max-width:360px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.cred .hint{font-size:11.5px;color:#98a3b8}
.chat{flex:1;min-height:280px;max-height:calc(100vh - 410px);overflow:auto;padding:14px 16px}
.chat-empty{font-size:12.5px;color:#98a3b8}
.tmsg{max-width:78%;white-space:pre-wrap;word-break:break-word;padding:.5rem .78rem;
  border-radius:var(--r-lg);font-size:13px;line-height:1.55;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.tmsg.me{background:linear-gradient(135deg,#3576f0,#2a5ce0);color:#fff;border-bottom-right-radius:4px}
.tmsg.ai{background:#f7f9fc;color:var(--txt);border:1px solid #e8eef7;border-bottom-left-radius:4px}
.tmsg.pending{opacity:.65}
.tmsg .md>:first-child{margin-top:0}
.tmsg .md>:last-child{margin-bottom:0}
.tmsg .md p{margin:.35em 0}
.tmsg .md h1,.tmsg .md h2,.tmsg .md h3,.tmsg .md h4{font-size:1.02em;font-weight:700;margin:.6em 0 .3em}
.tmsg .md ul,.tmsg .md ol{padding-left:1.35em;margin:.35em 0}
.tmsg .md li{margin:.15em 0}
.tmsg .md pre{background:#0d1526;color:#dbe5f5;padding:10px 12px;border-radius:var(--r-sm);
  font-size:12px;line-height:1.5;overflow-x:auto;margin:.5em 0}
.tmsg .md pre code{background:none;padding:0;color:inherit;font-size:inherit}
.tmsg .md code{background:rgba(13,21,38,.08);padding:.12em .38em;border-radius:var(--r-xs);font-size:.88em}
.tmsg .md blockquote{border-left:3px solid var(--acc);margin:.45em 0;padding:.05em .8em;color:#5b6b84}
.tmsg .md table{border-collapse:collapse;margin:.5em 0;font-size:.92em}
.tmsg .md th,.tmsg .md td{border:1px solid #d8e0ec;padding:.28em .6em}
.tmsg .md th{background:rgba(47,111,237,.07)}
.tmsg .md a{color:#2f5bc7;text-decoration:underline}
.tmsg .md hr{border:0;border-top:1px solid #dde5f0;margin:.6em 0}
.tmsg .think{border:1px dashed #ccd8e8;border-radius:var(--r-sm);margin-bottom:.55em;padding:8px 11px;background:rgba(47,111,237,.045)}
.tmsg .think-hd{font-size:11px;font-weight:600;color:#98a3b8;letter-spacing:.6px;margin-bottom:4px}
.tmsg .think-body{font-size:12.5px;color:#64748b;line-height:1.55}
.tmsg .think-body>:first-child{margin-top:0}
.tmsg .think-body>:last-child{margin-bottom:0}
.tmsg .err{margin-top:.3em;font-size:12px;color:#dc2626;white-space:pre-wrap}
.tmsg.tool-bubble{width:min(680px,88%);max-width:min(680px,88%);background:transparent;border:0;box-shadow:none;padding:0}
.tool-list{display:flex;flex-direction:column;gap:6px}
.tool-card{width:100%;border:1px solid #e4eaf2;border-radius:10px;background:#fff;overflow:hidden;transition:border-color .13s ease,box-shadow .13s ease}
.tool-card:hover{border-color:#cfdaea;box-shadow:0 2px 8px rgba(16,24,40,.05)}
.tool-head{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;user-select:none}
.tool-ico{width:24px;height:24px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;background:#eef4ff;color:#2f5bc7;font-size:12px;flex-shrink:0}
.tool-name{font-size:12.5px;font-weight:600;color:#2c3a52;flex-shrink:0}
.tool-target{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;color:#68758a;
  background:#f5f8fc;border:1px solid #e8eef7;border-radius:5px;padding:1px 6px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;max-width:52%}
.tool-state{margin-left:auto;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;flex-shrink:0}
.tool-state.ok{color:#047857;background:#ecfdf5}
.tool-state.err{color:#b91c1c;background:#fef2f2}
.tool-state.run{color:#b45309;background:#fffbeb}
.tool-state.idle{color:#64748b;background:#f1f5f9}
.tool-chev{font-size:10px;color:#98a3b8;transition:transform .15s ease}
.tool-card.open .tool-chev{transform:rotate(180deg)}
.tool-body{border-top:1px dashed #e8eef7;background:#fafbfd;padding:8px 10px;max-height:280px;overflow:auto}
.tool-pre{margin:0;background:transparent;color:#334155;font-size:11.5px;line-height:1.5;white-space:pre-wrap;
  word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.model-meta{font-size:11px;color:#98a3b8;white-space:nowrap}

.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;resize:vertical;min-height:58px;font-size:13px}
.composer .btn{flex-shrink:0}
.composer-side{display:flex;gap:8px;align-items:center;flex-shrink:0}
.composer-side .form-select-sm{width:116px}
@media(max-width:720px){.composer{flex-wrap:wrap}.composer textarea{flex-basis:100%}.composer-side{width:100%;justify-content:flex-end;flex-wrap:wrap}}

.diag-body{padding:.5rem .9rem .7rem}
.diag-chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px;border-radius:var(--r-pill);
  background:#f4f7fb;border:1px solid #e8eef7;color:#5b6b84;font-variant-numeric:tabular-nums}
.chip b{font-weight:700;color:#2c3a52}
.chip.ok{background:#effaf3;border-color:#cdebd8;color:#15803d}
.chip.bad{background:#fff4f4;border-color:#f6d5d5;color:#b91c1c}
.chip.info{background:#eef4ff;border-color:#d3e2fb;color:#1d4ed8}
.diag-err{margin-top:6px;font-size:12px;color:#dc2626;white-space:pre-wrap;word-break:break-word}
.diag-empty{font-size:12px;color:#98a3b8}
.traw{max-height:200px;overflow:auto;margin:6px 0 0;font-size:11.5px;white-space:pre-wrap;word-break:break-all;
  background:#0d1526;color:#cfe0f5;border-radius:var(--r-sm);padding:9px 11px}

.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast-item{padding:9px 14px;border-radius:9px;color:#fff;font-size:13px;max-width:380px;
  box-shadow:0 8px 26px rgba(16,24,40,.22);background:#16a34a;transition:opacity .2s ease,transform .2s ease}
.toast-item.danger{background:#dc2626}
.toast-item.warning{background:#d97706}
.toast-item.out{opacity:0;transform:translateY(6px)}

.mask{position:fixed;inset:0;background:rgba(9,16,30,.5);display:flex;align-items:center;justify-content:center;z-index:70;padding:20px}
.dialog{width:100%;max-width:420px;background:#fff;border-radius:14px;padding:18px 18px 14px;box-shadow:0 24px 70px rgba(2,8,20,.4)}
.dialog-title{font-size:15px;font-weight:700;color:#1c2536;margin-bottom:8px}
.dialog-body{font-size:13px;color:#5b6b84;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.dialog-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

@media(max-width:1200px){.layout{grid-template-columns:236px minmax(0,1fr)}.rightbar{grid-column:1/-1;height:auto;position:static;border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-content:start}}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .sidebar{width:100%;height:auto;position:static}
  .rightbar{grid-column:auto}
  .proj-list{max-height:180px}
  .content{padding:14px}
  .chat{max-height:46vh}
}
.workspace-panel{padding:10px 14px}.workspace-panel summary{cursor:pointer;font-weight:600}.workspace-files{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.workspace-file{display:flex;gap:4px;align-items:center;padding:4px 8px;border:1px solid var(--line);border-radius:8px}.workspace-file button{border:0;background:transparent;color:var(--acc);font-size:12px}.workspace-file button:last-child{color:var(--mut)}
</style>

<style>
/* DSH-inspired light workspace for WebClaw */
:root{--wc-bg:#f7f7f8;--wc-panel:#fff;--wc-line:rgba(15,17,21,.09);--wc-text:#0f1115;--wc-sub:#61666b;--wc-muted:#8b9096;--wc-blue:#2f6fed;--wc-radius:14px}
body{background:var(--wc-bg);color:var(--wc-text)}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr) 330px;min-height:100vh;background:var(--wc-bg)}
.sidebar{width:280px;background:var(--wc-panel);color:var(--wc-text);border-right:1px solid var(--wc-line);height:100vh;position:sticky;top:0}
.brand{padding:18px 18px 14px;border-bottom:0;gap:10px}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--wc-blue);box-shadow:none;font-size:16px}
.brand .bt{color:var(--wc-text);font-size:15px;letter-spacing:0}
.brand .bt small{color:var(--wc-muted);font-size:10.5px;letter-spacing:.6px;margin-top:3px;text-transform:none}
.side-body{padding:0 12px 12px}
.side-btn{height:38px;border:1px solid var(--wc-line);background:#fff;color:var(--wc-text);border-radius:10px;font-size:12.5px;justify-content:flex-start;padding:0 12px;box-shadow:none}
.side-btn:hover{background:#f4f5f7;color:var(--wc-text);border-color:#d9dce1}
.side-btn.primary{background:var(--wc-blue);border-color:var(--wc-blue);color:#fff;justify-content:center;box-shadow:0 4px 12px rgba(47,111,237,.18)}
.side-btn.primary:hover{background:#245cd8;border-color:#245cd8}
.side-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.side-row .side-btn{justify-content:center;font-size:12px;height:34px}
.nav-label{color:var(--wc-muted);font-size:11px;letter-spacing:.3px;text-transform:none;padding:18px 8px 8px;font-weight:600}
.proj{color:#3d4148;padding:9px 10px;border-radius:9px;margin-bottom:2px}
.proj:hover{background:#f3f4f6;color:var(--wc-text)}
.proj.active{background:#eef2ff;color:#1f4fd0}
.proj.active::before{display:none}
.proj .nm{font-size:13px;font-weight:600}
.proj .mt{color:var(--wc-muted);font-size:11px}
.sidebar .foot{border-top:1px solid var(--wc-line);padding:10px 12px}
.sidebar .foot a{color:var(--wc-sub);font-size:12.5px}
.content{padding:0;gap:0;background:var(--wc-bg);height:100vh;overflow:hidden;display:flex;flex-direction:column}
.workspace-head{height:58px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 22px;border-bottom:1px solid var(--wc-line);background:rgba(247,247,248,.92);backdrop-filter:blur(8px)}
.crumb{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--wc-muted);min-width:0}
.crumb b{color:var(--wc-text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:320px}
.crumb .bi{font-size:10px}
.head-actions{display:flex;align-items:center;gap:7px;flex-shrink:0}
.head-actions .btn{font-size:11.5px;border-color:var(--wc-line);color:var(--wc-sub);background:#fff;border-radius:8px;height:30px;padding:0 10px}
.head-actions .btn:hover{background:#f3f4f6;color:var(--wc-text)}
.scope-chip{margin:0;background:#eef2ff;border-color:#dbe5ff;color:#1f4fd0;font-size:11px;padding:3px 9px}
.chat-wrap{flex:1;min-height:0;overflow:auto;padding:18px 22px 0;display:flex;justify-content:center}
.chat{width:100%;max-width:900px;max-height:none;height:100%;overflow:auto;padding:8px 4px 18px;background:transparent;border:0;box-shadow:none}
.tmsg{max-width:84%;font-size:13.5px;line-height:1.65;box-shadow:none;padding:9px 13px}
.tmsg.me{background:#eef2ff;color:var(--wc-text);border:1px solid #dfe6ff;border-bottom-right-radius:6px}
.tmsg.ai{background:#fff;border:1px solid var(--wc-line);border-bottom-left-radius:6px}
.tmsg.tool-bubble{max-width:100%;width:100%;background:transparent;border:0;padding:0}
.tool-card{border-color:var(--wc-line);box-shadow:none;border-radius:10px}
.tool-card:hover{box-shadow:0 2px 10px rgba(15,17,21,.05)}
.tool-head{padding:8px 10px}
.composer{flex-shrink:0;width:min(900px,calc(100% - 44px));margin:0 auto 12px;background:#fff;border:1px solid var(--wc-line);border-radius:16px;box-shadow:0 10px 34px rgba(15,17,21,.07);padding:10px 12px;display:flex;flex-direction:column;align-items:stretch;gap:8px}
.composer textarea{flex:none;border:0;background:transparent;box-shadow:none;padding:3px 4px 0;min-height:48px;max-height:180px;resize:none;font-size:14px;line-height:1.55;color:var(--wc-text)}
.composer textarea:focus{box-shadow:none;border:0}
.composer-bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.composer-bar .form-select-sm{height:32px;font-size:12px;border-color:transparent;background-color:#f5f6f8;border-radius:9px;box-shadow:none}
#wc-model{min-width:190px;max-width:270px}
#wc-effort{width:112px;min-width:112px}
.access-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:#f5f6f8;font-size:11.5px;color:var(--wc-sub);cursor:pointer;white-space:nowrap}
.access-pill input{margin:0}
.access-pill:has(input:checked){background:#eef2ff;color:#1f4fd0}
.icon-btn{width:32px;height:32px;border:1px solid var(--wc-line);background:#fff;border-radius:9px;color:var(--wc-sub);display:grid;place-items:center;flex-shrink:0}
.icon-btn:hover{background:#f3f4f6;color:var(--wc-text)}
.send-btn{width:34px;height:34px;border-radius:50%;background:var(--wc-blue);color:#fff;border:0;display:grid;place-items:center;flex-shrink:0}
.send-btn:hover{background:#245cd8}
.send-btn:disabled{opacity:.5}
.composer .btn-outline-danger{height:32px;font-size:11.5px;border-radius:9px}
.composer .spacer{flex:1}
.model-meta{font-size:10.5px;color:var(--wc-muted);white-space:nowrap}
.dsh-empty{width:100%;min-height:52vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--wc-muted);text-align:center;padding:20px}
.dsh-empty .mark{width:42px;height:42px;border-radius:12px;background:var(--wc-blue);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;margin-bottom:4px}
.empty-title{font-size:18px;font-weight:650;color:var(--wc-text);letter-spacing:-.2px}
.empty-sub{font-size:12.5px;line-height:1.6;max-width:430px}
.empty-prompts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.empty-prompt{border:1px solid var(--wc-line);background:#fff;border-radius:10px;padding:8px 11px;font-size:12px;color:#3d4148;cursor:pointer;transition:all .12s ease}
.empty-prompt:hover{border-color:#c8d6f5;background:#f8faff;color:#1f4fd0}
.rightbar{background:#fbfbfc;border-left:1px solid var(--wc-line);padding:14px;gap:10px;height:100vh;position:sticky;top:0;overflow:auto}
.right-card{background:#fff;border:1px solid var(--wc-line);border-radius:14px;box-shadow:0 1px 2px rgba(15,17,21,.03)}
.right-card-head{padding:11px 12px;font-size:12px;background:#fff;border-bottom:1px solid var(--wc-line)}
.right-card-head .bi{color:var(--wc-muted)}
.right-card-body{padding:10px 12px}
.right-card .form-control-sm,.right-card .form-select-sm{border-color:var(--wc-line);background:#fbfbfc;border-radius:8px;font-size:12px}
.right-card textarea.form-control-sm{resize:vertical;min-height:64px}
.right-card .form-check-label{font-size:11.5px;color:var(--wc-sub)}
.gh-hint{font-size:10.5px;color:var(--wc-muted);line-height:1.55}
.gh-status{font-size:10.5px;color:var(--wc-muted)}
.gh-status.ok{color:#15803d}
.gh-run{border-color:var(--wc-line);border-radius:9px}
.gh-run:hover{background:#f7f9fc;border-color:#cfdaea}
.right-card .workspace-files{max-height:160px;overflow:auto}
.diag-card{width:min(900px,calc(100% - 44px));margin:0 auto 12px;border:0;background:transparent;box-shadow:none;padding:0}
.diag-card>summary{font-size:11.5px;color:var(--wc-muted);cursor:pointer;list-style:none;padding:2px 4px}
.diag-card>summary::-webkit-details-marker{display:none}
.diag-card .diag-body{padding:6px 4px 0}
.diag-card .chip{font-size:10.5px}
.composer{position:relative}
.ctx-btn,.effort-btn{height:32px;display:inline-flex;align-items:center;gap:5px;padding:0 9px;border:1px solid var(--wc-line);background:#fff;border-radius:9px;color:var(--wc-sub);font-size:11.5px;white-space:nowrap;flex-shrink:0}
.ctx-btn:hover,.effort-btn:hover{background:#f3f4f6;color:var(--wc-text);border-color:#d9dce1}
.ctx-btn .bi,.effort-btn .bi{font-size:12px}
.wc-pop{position:absolute;z-index:30;background:#fff;border:1px solid var(--wc-line);border-radius:14px;box-shadow:0 18px 50px rgba(15,17,21,.16);padding:12px}
.context-pop{right:8px;bottom:calc(100% + 8px);width:320px}
.effort-pop{right:8px;bottom:calc(100% + 8px);width:280px}
.pop-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:600;color:var(--wc-text);margin-bottom:9px}
.pop-head span:last-child,.pop-head b{font-weight:500;color:var(--wc-muted);font-size:11px}
.ctx-bar{height:8px;border-radius:999px;background:#eef1f5;overflow:hidden;margin-bottom:9px}
.ctx-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#2f6fed,#60a5fa);transition:width .2s ease}
.ctx-row{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:11.5px;color:#3d4148;padding:3px 0}
.ctx-dot{width:8px;height:8px;border-radius:50%}
.ctx-pct{color:var(--wc-muted);font-variant-numeric:tabular-nums}
.ctx-out{font-size:10.5px;color:var(--wc-muted);line-height:1.5;margin-top:3px}
.ctx-foot{border-top:1px solid var(--wc-line);margin-top:8px;padding-top:8px;display:flex;justify-content:space-between;font-size:11.5px;color:var(--wc-sub)}
.ctx-foot b{color:var(--wc-text);font-weight:600}
.effort-pop .range{appearance:none;-webkit-appearance:none;width:100%;height:10px;border-radius:999px;background:linear-gradient(90deg,#10b981,#06b6d4,#2f6fed);outline:none;margin:8px 0 5px;cursor:pointer}
.effort-pop .range::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid #2f6fed;box-shadow:0 2px 7px rgba(15,17,21,.2);cursor:grab}
.effort-scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--wc-muted)}
.effort-note{display:flex;justify-content:space-between;font-size:10.5px;color:var(--wc-muted);margin-top:9px}
.effort-note span:last-child{color:var(--wc-text)}
@media(max-width:860px){.context-pop,.effort-pop{right:0;width:min(320px,calc(100vw - 32px))}}
@media(max-width:1280px){.layout{grid-template-columns:260px minmax(0,1fr) 310px}.sidebar{width:260px}}
@media(max-width:1180px){.layout{grid-template-columns:260px minmax(0,1fr)}.rightbar{grid-column:1/-1;height:auto;position:static;border-left:0;border-top:1px solid var(--wc-line);display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-content:start}.content{height:auto;min-height:100vh}.chat-wrap{max-height:58vh}.chat{height:auto;max-height:58vh}}
@media(max-width:860px){.layout{grid-template-columns:1fr}.sidebar{width:100%;height:auto;position:static}.rightbar{grid-column:auto}.content{padding:0}.workspace-head{padding:0 14px;height:54px}.crumb b{max-width:160px}.head-actions .btn{padding:0 8px}.chat-wrap{padding:14px 12px 0;max-height:52vh}.composer{width:calc(100% - 24px);margin-bottom:10px}.diag-card{width:calc(100% - 24px)}.chat{max-height:52vh}.composer-bar{gap:6px}#wc-model{min-width:150px;flex:1}}

</style>
<script src="/assets/ui.js?v={{VERSION}}"></script>
</head>
<body data-page="webclaw">
<div class="layout">
  <aside class="sidebar">
    <div class="brand"><span class="mark">言</span><span class="bt">言灵中转<small>WebClaw</small></span></div>
    <div class="side-body">
      <button id="wc-new" class="side-btn primary"><i class="bi bi-plus-lg"></i>新建任务</button>
      <div class="side-row">
        <button id="wc-export-all" class="side-btn" title="全部任务导出为一个文件">导出</button>
        <button id="wc-import" class="side-btn" title="导入之前导出的文件">导入</button>
      </div>
      <div class="nav-label">任务列表</div>
      <div class="proj-list" id="wc-projects"></div>
    </div>
    <div class="foot"><a href="/admin"><i class="bi bi-arrow-left"></i>返回后台</a></div>
  </aside>

  <main class="content">
    <header class="workspace-head">
      <div class="crumb"><span>WebClaw</span><i class="bi bi-chevron-right"></i><b id="wc-project-name">默认任务</b></div>
      <div class="head-actions">
        <span id="wc-hint" class="scope-chip"></span>
        <button id="wc-reload" class="btn btn-sm">刷新模型</button>
        <button id="wc-clear" class="btn btn-sm">清空</button>
        <button id="wc-export-one" class="btn btn-sm">导出</button>
      </div>
    </header>

    <div class="chat-wrap"><div class="card chat" id="wc-chat" aria-live="polite"></div></div>

    <div class="composer">
      <textarea id="wc-input" class="form-control form-control-sm" rows="2"
        placeholder="输入任务，Enter 发送，Shift+Enter 换行"></textarea>
      <div class="composer-bar">
        <button id="wc-attach" class="icon-btn" type="button" title="添加文本文件"><i class="bi bi-plus-lg"></i></button>
        <label class="access-pill" title="允许 Agent 读写本机目录与已绑定仓库"><input id="wc-agent" class="form-check-input" type="checkbox">完全访问</label>
        <span id="wc-model-meta" class="model-meta"></span>
        <select id="wc-model" class="form-select form-select-sm" aria-label="模型"></select>
        <button id="wc-context" class="ctx-btn" type="button" title="查看上下文容量"><i class="bi bi-pie-chart"></i><span id="wc-ctx-label">上下文</span></button>
        <select id="wc-effort" class="d-none" aria-label="思考强度">
          <option value="">默认</option>
          <option value="off">关闭</option>
          <option value="minimal">最低</option>
          <option value="low">低</option>
          <option value="medium">中</option>
          <option value="high">高</option>
          <option value="max">最高</option>
        </select>
        <button id="wc-effort-btn" class="effort-btn" type="button" title="思考强度"><i class="bi bi-lightbulb"></i><span id="wc-effort-btn-label">思考：默认</span></button>
        <span class="spacer"></span>
        <button id="wc-send" class="send-btn" type="button" title="发送"><i class="bi bi-arrow-up"></i></button>
        <button id="wc-stop" class="btn btn-outline-danger" disabled>停止</button>
      </div>
      <div id="wc-context-pop" class="wc-pop context-pop" hidden>
        <div class="pop-head"><span>上下文容量</span><span id="wc-ctx-ratio">—</span></div>
        <div class="ctx-bar"><i id="wc-ctx-fill" style="width:0"></i></div>
        <div id="wc-ctx-rows"></div>
        <div class="ctx-out" id="wc-ctx-out"></div>
        <div class="ctx-foot"><span>平均缓存命中率</span><b id="wc-ctx-cache">—</b></div>
      </div>
      <div id="wc-effort-pop" class="wc-pop effort-pop" hidden>
        <div class="pop-head"><span>思考强度</span><b id="wc-effort-label">默认</b></div>
        <input id="wc-effort-range" class="range" type="range" min="0" max="6" step="1" value="0">
        <div class="effort-scale"><span>关闭</span><span>最低</span><span>中</span><span>最高</span></div>
        <div class="effort-note"><span>Ctrl+T 快速切换</span><span id="wc-effort-note">默认</span></div>
      </div>
    </div>
  </main>
  <aside class="rightbar">
    <section class="right-card">
      <div class="right-card-head"><i class="bi bi-github"></i><span>Git 工具</span><span class="gh-status" id="gh-status">未绑定</span></div>
      <div class="right-card-body">
        <div class="gh-field"><input id="gh-repo" class="form-control form-control-sm" placeholder="owner/repo" autocomplete="off" spellcheck="false"></div>
        <div class="gh-row">
          <input id="gh-branch" class="form-control form-control-sm" value="main" placeholder="分支" autocomplete="off" spellcheck="false">
          <input id="gh-token" class="form-control form-control-sm" type="password" placeholder="GitHub Token" autocomplete="new-password" spellcheck="false">
        </div>
        <label class="form-check m-0 mt-1"><input class="form-check-input" type="checkbox" id="gh-allow"><span class="form-check-label small ms-1">允许 Agent 直接提交/触发 Actions</span></label>
        <div class="d-flex gap-2 mt-2">
          <button id="gh-bind" class="btn btn-sm btn-primary flex-fill">绑定</button>
          <button id="gh-unbind" class="btn btn-sm btn-outline-secondary">解绑</button>
        </div>
        <div class="gh-hint">Token 只保存在当前浏览器，不会发给网关。需要 Contents、Actions、Workflows 权限。</div>
      </div>
    </section>
    <section class="right-card">
      <div class="right-card-head"><i class="bi bi-play-circle"></i><span>Actions</span><button id="gh-refresh-runs" class="btn btn-sm btn-outline-secondary ms-auto">刷新</button></div>
      <div id="gh-runs" class="right-card-body gh-runs"><div class="gh-hint">绑定仓库后显示最近运行</div></div>
    </section>
    <section class="right-card">
      <div class="right-card-head"><i class="bi bi-sliders"></i><span>项目</span></div>
      <div class="right-card-body">
        <textarea id="wc-system" class="form-control form-control-sm mb-2" rows="3" placeholder="系统提示"></textarea>
        <div class="form-check form-switch m-0"><input class="form-check-input" type="checkbox" id="wc-stream" checked><label class="form-check-label ms-1" for="wc-stream">流式输出</label></div>
      </div>
    </section>
    <section class="right-card">
      <div class="right-card-head"><i class="bi bi-folder2-open"></i><span>工作区</span><span id="wc-workspace-status" class="gh-status"></span></div>
      <div class="right-card-body">
        <div class="d-flex flex-wrap gap-2">
          <button id="wc-directory" class="btn btn-sm btn-outline-secondary">连接本机目录</button>
          <button id="wc-disconnect" class="btn btn-sm btn-outline-secondary" hidden>断开目录</button>
        </div>
        <div id="wc-files" class="workspace-files"></div>
      </div>
    </section>
    <section class="right-card">
      <div class="right-card-head"><i class="bi bi-key"></i><span>网关</span></div>
      <div class="right-card-body">
        <div class="d-flex gap-2">
          <input id="wc-token" type="password" class="form-control form-control-sm" placeholder="网关令牌（留空按开放模式）" autocomplete="new-password" spellcheck="false" data-lpignore="true">
          <button id="wc-token-reveal" class="btn btn-sm btn-outline-secondary" title="显示/隐藏令牌"><i class="bi bi-eye"></i></button>
        </div>
        <div class="d-flex align-items-center gap-2 mt-2">
          <button id="wc-token-fetch" class="btn btn-sm btn-outline-secondary">取后台令牌</button>
          <span class="hint" id="wc-scope"></span>
        </div>
      </div>
    </section>
    <section class="right-card">
      <div class="right-card-head"><i class="bi bi-activity"></i><span>运行</span><span id="wc-diag-sum" class="gh-status"></span></div>
      <div class="right-card-body">
        <div id="wc-diag" class="diag-chips"><span class="diag-empty">尚未发起请求</span></div>
        <details class="mt-2 d-none" id="wc-raw-wrap">
          <summary class="small text-primary" style="cursor:pointer">原始事件流</summary>
          <pre id="wc-raw" class="traw"></pre>
        </details>
      </div>
    </section>
  </aside>
</div>

<input type="file" id="wc-attach-file" accept="text/*,.md,.json,.csv,.rs,.js,.ts,.py,.html,.css,.toml,.yaml,.yml,.xml,.log" multiple hidden>
<input type="file" id="wc-import-file" accept="application/json,.json" hidden>
<script>window.NGW = {base: "/", csrf: "{{CSRF}}", mode: "{{MODE}}", who: "{{WHO}}"};</script>
<script src="/assets/webclaw-agent.js?v={{VERSION}}"></script>
<script src="/assets/webclaw.js?v={{VERSION}}"></script>
</body>
</html>
